[project]
name = "async-model-gateway"
version = "0.6.0"
description = "Async-first foundation for a model gateway project."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "typing_extensions>=4.5",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.22.0,<1.22.1",
]

[project.scripts]
async-model-gateway = "async_model_gateway:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff",
    "pyright",
    "tach",
    "pre-commit",
    "onnx>=1.16.2,<1.17",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "N",
    "D",
    "UP",
    "B",
    "A",
    "C4",
    "ARG",
    "RUF",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["D", "ARG"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["src"]
exclude = [
    "**/tests/**",
    "**/__pycache__",
    "**/node_modules",
    "**/.*",
    ".venv",
    "**/dist",
    "**/build",
    "**/.eggs",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
addopts = "--cov=src/async_model_gateway --cov-report=term-missing --cov-report=json:.coverage-reports/coverage.json"

[tool.coverage.run]
source = ["src/async_model_gateway"]
omit = ["**/tests/**", "**/__pycache__/**"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.json]
output = ".coverage-reports/coverage.json"
