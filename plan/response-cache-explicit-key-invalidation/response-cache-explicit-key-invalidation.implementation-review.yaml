contract_check:
  - item: >-
      ResponseCache.invalidate(*, key: ResponseCacheKey) -> bool directly
      delegates the unchanged key and propagates errors/cancellation unchanged.
    status: matches
    detail: >-
      cache.py directly awaits store.invalidate(key=key); facade tests cover
      both boolean results, the original key, RuntimeError, and CancelledError.
  - item: >-
      ResponseCacheStore.invalidate(*, key: ResponseCacheKey) -> bool is
      submodule-public only, while root and ports exports remain unchanged.
    status: matches
    detail: >-
      The abstract keyword-only async method is in ports/store.py only, and
      package-surface tests lock the export boundary and resolved annotation.
  - item: >-
      Fresh invalidation removes exactly the requested record and returns True;
      absent or policy-confirmed stale records return False, with stale records
      reclaimed.
    status: matches
    detail: >-
      In-memory invalidation accesses the requested dictionary key, deletes
      only after a completed True or False policy result, and returns the
      specified boolean in each branch.
  - item: >-
      Policy exception or cancellation propagates unchanged and preserves the
      record; existing get/set and lookup-time reclamation behavior persist.
    status: matches
    detail: >-
      No failure handler is added before deletion; focused tests prove later
      fresh access succeeds after RuntimeError and CancelledError, and existing
      get/set regression tests remain green.
  - item: >-
      _CacheLookupDecision is private, has only HIT/MISS, and match preserves
      the existing ResponseCacheEntry | None lookup contract.
    status: matches
    detail: >-
      The enum and match occur only in _in_memory_store.py; focused tests cover
      HIT, absent MISS, stale-reclaimed MISS, and failure propagation.

