contract_and_boundary_checks:
  public_abc: >-
    LoadedRuntimeModel is a nominal ABC with abstract readonly loader_family and a
    non-public _provider_runtime() handoff. It is neither a dataclass, alias, Protocol,
    nor Generic.
  private_implementation: >-
    _LocalLoadedRuntimeModel and _create_loaded_runtime_model remain module-private;
    the concrete implementation uses ordinary keyword-only __init__ and no __new__,
    custom __setattr__, frozen-dataclass, constructor-token, or immutability mechanism.
  payload_isolation: >-
    The provider runtime is held only by the private concrete implementation and is
    unavailable through the runtime_model package public surface; the underscore handoff
    is limited to model-side internal consumption.
  typed_acquisition: >-
    ModelPool.acquire, LocalModelLoader.load, and all three private family handlers
    return LoadedRuntimeModel. Existing validation, retained loader, direct await,
    explicit match/case, assert_never, and no-I/O stubs are preserved.
  failure_and_cancellation: >-
    No exception translation or task management is introduced. Generic loader failures
    and asyncio.CancelledError continue to propagate unchanged.
  tests_and_scope: >-
    Runtime-model and modified model-pool tests use static imports, assertions, and no
    real I/O or dynamic module loading. No artifact, registry, cache, gateway,
    execution, release, or documentation scope drift was found.
