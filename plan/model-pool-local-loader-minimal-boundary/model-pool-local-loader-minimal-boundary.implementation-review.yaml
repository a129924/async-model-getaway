contract_check:
  - item: ModelPool is the only model_pool package-root public export.
    status: matches
    detail: __all__ is exactly ["ModelPool"]; LocalModelLoader remains private.
  - item: >-
      ModelPool.acquire is async acquire(self, artifact: ModelArtifact) -> object
      with no added public options.
    status: matches
    detail: pool.py exposes the locked signature and targeted package-surface test passes.
  - item: >-
      ModelPool construction calls the zero-argument private factory once and retains
      that returned loader; acquire directly awaits it.
    status: matches
    detail: pool.py constructs once in __init__ and delegates through direct await.
  - item: >-
      LocalModelLoader is internal-only; its sole test seam validates exact
      LoaderFamily mapping keys and callable values before awaiting a route.
    status: matches
    detail: >-
      _local_model_loader.py validates Mapping, exact set(LoaderFamily), and callables
      before load dispatch; the package root does not re-export it.
  - item: >-
      ModelArtifact is consumed unchanged; non-artifact input fails before routing;
      selected route result, failure, and cancellation propagate unchanged.
    status: matches
    detail: >-
      acquire type-checks before direct await; no exception translation is present;
      targeted tests cover TypeError, identity-preserving route failure, and cancellation.

