boundary_checks:
  generator_and_asset: >-
    The generator constructs one fixed Identity graph, serializes deterministically,
    and its --check branch only compares bytes. The drift test executes a copied
    generator against a copied, deliberately changed asset, proving non-writing
    failure without mutating the committed fixture.
  runtime_evidence: >-
    The happy path awaits the real _OnnxModelLoader with the committed asset, proves
    the result is onnxruntime.InferenceSession, and asserts exactly
    [CPUExecutionProvider]. The invalid-artifact path uses the real Loader and checks
    only the onnxruntime. exception-module origin. No reviewed test calls run() or an
    Executor/invoker.
  test_governance: >-
    Reviewed tests use static imports; no dynamic module loading, module-table
    fabrication, monkeypatch of the real Loader/provider, Any, cast, or source-level
    type suppression was added. The subprocess call is limited to invoking the copied
    generator CLI for the isolated byte-drift contract.
  typing_boundary: >-
    The topic-local config includes only the generator and Protocol witness, remains
    Python 3.10 strict, and has reportPrivateUsage: none as its sole diagnostic
    override. The witness does not import onnxruntime and preserves the Loader's
    _OnnxRuntime return contract.
  scope: >-
    Diff inspection found changes only in the declared tests, fixture generator and
    asset, witness, topic-local config, and topic evidence. No production source,
    dependency or lock metadata, global configuration, documentation, CI, public API,
    or other runtime-family path changed.

review_notes:
  - >-
    Sequencing gate passed: the approved implementation-review artifact records all
    planned implementation steps complete.
  - >-
    The new code is fully annotated where its dedicated strict target applies; the
    runtime tests remain intentionally outside that target because the provider lacks
    stubs, while retaining direct runtime assertions.
  - >-
    Error behavior is intentionally narrow: check mode reports drift via its exit
    status and stderr, while the real provider failure remains unwrapped and the test
    avoids coupling to provider-specific type names or messages.
  - >-
    Existing options-rejection, provider-failure, off-thread construction, and
    cancellation tests are preserved; their only valid-model dependency now points to
    the committed artifact.
  - >-
    No production logging is required for this test/fixture-only change; the generator
    emits only its actionable command-line drift diagnostic and no sensitive data.

