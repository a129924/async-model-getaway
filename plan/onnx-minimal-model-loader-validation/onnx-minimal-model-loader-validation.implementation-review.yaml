scope_creep_check:
  - non_goal: "No inference, output-value assertion, ONNX invoker, Executor behavior, GPU support, provider configuration, session lifecycle, cache, close/unload, timeout, or retry."
    violated: no
    evidence: "clean; real session evidence reads only get_providers() at tests/model_runtime/model_pool/test_onnx_model_loader.py:105 and tests/model_runtime/model_pool/test_onnx_local_runtime_acquisition.py:60."
  - non_goal: "No change to production _OnnxRuntime, _OnnxModelLoader, ModelPool, binding, Executor, package exports, public API, dependency manifest, lockfile, global type configuration, README, docs, CI, version, release, commit, or PR state."
    violated: no
    evidence: "clean; changed paths are limited to declared topic tests, fixture generator/asset, witness, topic-local config, and topic evidence."
  - non_goal: "No Any, cast, inline type ignore, dynamic import, fabricated modules, fake importer, or monkeypatch of real Loader/provider in the new evidence."
    violated: no
    evidence: "clean; runtime tests use static onnxruntime imports at tests/model_runtime/model_pool/test_onnx_model_loader.py:12 and tests/model_runtime/model_pool/test_onnx_local_runtime_acquisition.py:12; the new drift test copies and executes the real generator at tests/model_runtime/model_pool/test_onnx_model_loader.py:82."

