contract_check:
  - item: two-method, five-keyword-only-collaborator ResponseCache facade
    status: matches
    detail: cache.py exposes only keyword-only lookup and remember, with the five declared collaborators.
  - item: CacheKey identity and immutable complete record authority
    status: matches
    detail: key.py has only the three frozen/slotted identity fields; record.py validates schema, UTC ordering, opaque token, and metadata bounds.
  - item: write-time expiry, closed outcomes, and cancellation propagation
    status: matches
    detail: facade builds one record at remember, maps only CacheOperationalError subclasses, and does not catch CancelledError.
  - item: token-guarded stale cleanup and separate invalidation
    status: matches
    detail: stale paths call delete_if_version with the observed token; StoreCacheInvalidator owns ordinary key-local delete mapping.
  - item: compatibility containment and target import surfaces
    status: matches
    detail: legacy names are compat-only, package and ports surfaces are exact, and deleted normal modules have ordinary-import absence coverage.
  - item: documentation boundary
    status: matches
    detail: README.md, docs/architecture.md, and docs/specs/response-cache-boundary.md describe the target facade, separate invalidation, record ownership, and compat-only bridge.

