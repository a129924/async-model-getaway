contract_check:
  - item: two-method, five-collaborator ResponseCache facade
    status: matches
    detail: lookup and remember are the only async facade operations, and all collaborators are keyword-only.
  - item: CacheKey and complete immutable record authority
    status: matches
    detail: CacheKey owns only the three identity components; StoredCacheRecord enforces schema version 1, UTC ordering, token, and metadata limits.
  - item: write-time expiry, closed outcome translation, and cancellation propagation
    status: matches
    detail: remember maps only known operational failures; direct store cancellation preserves the exact CancelledError instance at tests/response_cache/test_cache.py:371.
  - item: token-guarded stale cleanup and separate invalidation
    status: matches
    detail: stale cleanup uses delete_if_version with the observed token; StoreCacheInvalidator alone maps delete results.
  - item: compatibility adapter constructor and legacy containment
    status: matches
    detail: "LegacyResponseCacheAdapter accepts facade: ResponseCache and invalidator: CacheInvalidator; legacy names remain compat-only."
  - item: root, ports, and documentation boundaries
    status: matches
    detail: target root exports are exact, ports remain submodule-only, and documentation describes the target contract rather than legacy operations.

