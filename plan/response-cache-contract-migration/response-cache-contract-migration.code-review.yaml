review_notes:
  - >-
    ResponseCache retains only the two keyword-only async facade operations.
    ContextT is preserved on both invocation-only context parameters and context
    is explicitly discarded before collaborator use.
  - >-
    Stale cleanup catches only CacheOperationalError. The focused tests prove
    that both CancelledError and an unexpected RuntimeError from compare-delete
    propagate by identity, while an operational cleanup failure remains CacheMiss.
  - >-
    Production record metadata and compatibility feature normalization use
    TypeGuard-based narrowing without Any, cast, broad suppression, mutable
    defaults, dynamic execution, broad exception catches, task ownership, retry,
    or timeout logic. The two test-only scoped suppressions are reported above.
  - >-
    Response-cache tests use ordinary imports. The reviewed topic has no
    importlib, loader, exec, eval, runpy, or __import__ test path; the repository's
    grandfathered model-payload exception is outside this topic and was not used as precedent.
  - >-
    The public root, submodule-only ports, separate invalidator, compatibility-only
    legacy surface, whole-record replacement, and documentation all remain within
    the approved response-cache migration boundary.

