    status: matches
    detail: >-
      gateway.py:32-43 declares all five keyword-only inputs and CacheKey return;
      gateway.py:65-73 accepts cache_key_deriver and no hash_features.
  - item: Gateway hands the deriver result unchanged to lookup and remember after guards and freshness.
    status: matches
    detail: >-
      gateway.py:87-121 guards first, awaits freshness, invokes the deriver with every
      locked input, and reuses the one key variable for both cache calls.
  - item: Deriver owns identity policy and cache-facing privacy is preserved.
    status: matches
    detail: >-
      gateway.py contains no CacheKey construction or cache-identity algorithm; contexts
      are fresh object() calls at gateway.py:106 and gateway.py:121.
  - item: Existing outcomes, propagation, cancellation, and independent-miss behavior remain unchanged.
    status: matches
    detail: >-
      gateway.py:108-128 preserves exhaustive cache-outcome matching and direct awaits
