quality_and_boundary_checks:
  snapshot_top_level_semantics: >-
    approved: generate() performs exactly one dict(request.invocation) after
    both supported-path guards and immediately before resolve_freshness. No
    later gateway read of request.invocation exists. The copy is shallow, so
    nested leaf identity is deliberately retained without unapproved deep-copy
    or mutation-detection behavior.
  cache_key_identity: >-
    approved: the injected private deriver remains the sole cache-identity
    owner. The gateway forwards the one snapshot to it, never constructs or
    alters a CacheKey, and passes the returned opaque key unchanged to both
    lookup and miss-path remember.
  async_cancellation_and_errors: >-
    approved: registry, cache, and executor remain direct awaits. Snapshot,
    deriver, executor, and converter failures propagate without a catch, task,
    retry, timeout, lock, or cancellation suppression; unexpected closed
    outcomes remain exhaustive assert_never branches.
  public_surface_and_privacy: >-
    approved: package exports remain limited to LocalResponseGateway and
    LocalResponseRequest. Private collaborators stay module-private; raw model
    inputs reach only the deriver and cache contexts remain fresh opaque
    objects.
  test_governance_and_coverage: >-
    approved: deterministic registry suspension verifies the top-level mutation
    race, same snapshot identity at deriver and executor, shallow leaf identity,
    opaque-key reuse, materialization-failure ordering, guards, cancellation,
    independent misses, package surface, and strict type witness. Topic test
    paths contain no importlib, __import__, spec_from_file_location, or
    SourceFileLoader usage; no dynamic-loading exception is declared or used.
  documentation_deferral: >-
    approved: README.md, docs/architecture.md, and version metadata are absent
    from the committed range, matching the current plan's explicitly deferred
    post-merge 0.8.0 release work.

