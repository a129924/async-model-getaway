contract_check:
  - item: Package root re-exports ResponseCache, ResponseCacheEntry, ResponseCacheKey, and ResponseCacheKeyFactory.
    status: matches
    detail: >
      src/async_model_gateway/response_cache/__init__.py:3 exposes exactly those four names;
      tests/response_cache/test_response_cache_package_surface.py:14 verifies the export list.
  - item: Package root and response_cache.ports do not re-export ResponseCacheStore.
    status: matches
    detail: >
      src/async_model_gateway/response_cache/__init__.py:8 omits ResponseCacheStore and
      src/async_model_gateway/response_cache/ports/__init__.py:3 exports only FeatureHasher;
      tests/response_cache/test_response_cache_package_surface.py:39 and :44 verify both boundaries.
  - item: ResponseCache constructor is ResponseCache(store: ResponseCacheStore).
    status: matches
    detail: >
      src/async_model_gateway/response_cache/cache.py:15 defines the locked constructor;
      tests/response_cache/test_cache.py:41 verifies the public signature.
  - item: ResponseCache.get is async def get(self, *, key: ResponseCacheKey) -> ResponseCacheEntry | None.
    status: matches
    detail: >
      src/async_model_gateway/response_cache/cache.py:19 matches exactly and delegates directly;
      tests/response_cache/test_cache.py:41 and :57 verify the signature and behavior.
  - item: ResponseCache.set is async def set(self, *, key: ResponseCacheKey, entry: ResponseCacheEntry) -> None.
    status: matches
    detail: >
      src/async_model_gateway/response_cache/cache.py:23 matches exactly and delegates directly;
      tests/response_cache/test_cache.py:41 and :90 verify the signature and behavior.
  - item: ResponseCacheEntry is an immutable value type with only response: str.
    status: matches
    detail: >
      src/async_model_gateway/response_cache/entry.py:10 defines a frozen slotted dataclass
      with one field; tests/response_cache/test_entry.py:12, :20, and :27 verify the contract.
  - item: ResponseCacheStore is submodule-public at response_cache.ports.store with async get/set.
    status: matches
    detail: >
      src/async_model_gateway/response_cache/ports/store.py:13 defines the abstract async port;
      tests/response_cache/test_response_cache_package_surface.py:49 verifies the only allowed public path.
  - item: Store failures and cancellations propagate unchanged, and None means cache miss.
    status: matches
    detail: >
      src/async_model_gateway/response_cache/cache.py:19 and :23 do raw delegation;
      tests/response_cache/test_cache.py:75, :108, and :122 verify miss, failure propagation,
      and cancellation propagation.

