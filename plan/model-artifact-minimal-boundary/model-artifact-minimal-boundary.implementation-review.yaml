contract_check:
  - item: >
      Public subpackage import surface is async_model_gateway.model_artifact and it
      re-exports only ModelArtifact and LoaderFamily.
    status: matches
    detail: >
      src/async_model_gateway/model_artifact/__init__.py:3-6 exposes exactly those
      two names, and tests/model_artifact/test_model_artifact_package_surface.py:16-18
      verifies the export list and identity.
  - item: >
      LoaderFamily public surface is LoaderFamily(str, Enum) with bounded vocabulary
      pickle|torch|onnx and no inference behavior.
    status: matches
    detail: >
      src/async_model_gateway/model_artifact/loader_family.py:10-15 defines the
      bounded enum, and tests/model_artifact/test_loader_family.py:19-33 verifies the
      exact members and fail-closed rejection of unknown explicit values.
  - item: >
      ModelArtifact public surface is
      ModelArtifact(loader_family: LoaderFamily, artifact_path: str,
      loader_options: dict[str, JSONLike]).
    status: deviation
    detail: >
      The implementation stores the expected three fields at
      src/async_model_gateway/model_artifact/artifact.py:69-71, but the public
      constructor widens all three parameter annotations to object at
      src/async_model_gateway/model_artifact/artifact.py:76-78. A direct
      inspect.signature check returns
      (*, loader_family: 'object', artifact_path: 'object', loader_options: 'object')
      -> 'None', which drifts from the locked public typed contract at
      plan/model-artifact-minimal-boundary/model-artifact-minimal-boundary.plan.md:344-348.
  - item: >
      ModelArtifact must fail closed on blank artifact_path and malformed
      loader_options without accepting identity material.
    status: matches
    detail: >
      src/async_model_gateway/model_artifact/artifact.py:85-98 raises TypeError or
      ValueError as planned, and tests/model_artifact/test_model_artifact.py:42-98
      verifies blank-path rejection, malformed loader_options rejection, and
      model_payload rejection.
  - item: No existing public API is modified or removed.
    status: matches
    detail: >
      tests/model_artifact/test_model_artifact_package_surface.py:43-50 verifies the
      root package, model_registry, and response_cache do not re-export the new surface.

