contract_check:
  - item: >
      Public subpackage import surface is async_model_gateway.model_artifact and it
      re-exports only ModelArtifact and LoaderFamily.
    status: matches
    detail: >
      src/async_model_gateway/model_artifact/__init__.py:3-6 exposes exactly those
      two names, and tests/model_artifact/test_model_artifact_package_surface.py:8
      verifies the export list and identity.
  - item: >
      LoaderFamily public surface is LoaderFamily(str, Enum) with bounded vocabulary
      pickle|torch|onnx and no inference behavior.
    status: matches
    detail: >
      src/async_model_gateway/model_artifact/loader_family.py:10-15 defines the
      bounded enum, and tests/model_artifact/test_loader_family.py:10-34 verifies the
      exact members and fail-closed rejection of unknown explicit values.
  - item: >
      ModelArtifact public surface is
      ModelArtifact(loader_family: LoaderFamily, artifact_path: str,
      loader_options: dict[str, JSONLike]).
    status: matches
    detail: >
      src/async_model_gateway/model_artifact/artifact.py:89-99 declares the locked
      field and constructor annotations, and a reviewer-side `inspect.signature`
      probe returns
      `(*, loader_family: 'LoaderFamily', artifact_path: 'str', loader_options: 'dict[str, JSONLike]') -> 'None'`.
  - item: >
      ModelArtifact must fail closed on blank artifact_path and malformed
      loader_options without accepting identity material.
    status: matches
    detail: >
      src/async_model_gateway/model_artifact/artifact.py:73-107 raises TypeError or
      ValueError as planned, and tests/model_artifact/test_model_artifact.py:88-144
      verifies blank-path rejection, malformed loader_options rejection, invalid
