contract_check:
  - item: Internal-only FeatureHasher implementation with unchanged public exports.
    status: matches
    detail: Concrete class remains only in the private module; package-root and ports exports are unchanged.
  - item: Base-str material and frozen sorted JSON/UTF-8/SHA-256 representation.
    status: matches
    detail: Validation precedes str.__str__ extraction; exact base-string pairs are sorted lexicographically as complete tuples, then serialized with ensure_ascii=False and compact separators before SHA-256.
  - item: Duplicate base keys with distinct values remain valid and insertion-order independent.
    status: matches
    detail: pairs.sort() orders both base-key and base-value; direct and factory tests retain both duplicate-key pairs and match in opposite emission order.
  - item: Strict UTF-8 failure is TypeError chained from the original UnicodeEncodeError.
    status: matches
    detail: Only UnicodeEncodeError from the UTF-8 encode boundary is translated with raise TypeError(...) from exc.
  - item: Factory remains unchanged and propagates errors without key construction.
    status: matches
    detail: The unchanged factory delegates before ResponseCacheKey construction; focused test verifies the chained error and absent construction.

