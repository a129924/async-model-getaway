release_summary: >-
  Release the minimal ModelExecution owner with its typed async callable seam,
  single direct-await invocation, and unchanged exception and cancellation
  propagation. Provider frameworks, loader I/O, orchestrator and remote execution
  wiring, lifecycle ownership, timeout, and retry remain deferred.

